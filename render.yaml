services:
  - type: web
    name: mj-heehee
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/leaderboard.db
    disk:
      name: leaderboard-data
      mountPath: /var/data
      sizeGB: 1
