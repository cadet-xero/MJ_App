services:
  - type: web
    name: mj-heehee
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCORE_DATA_DIR
        value: /var/data
    disk:
      name: mj-data
      mountPath: /var/data
      sizeGB: 1